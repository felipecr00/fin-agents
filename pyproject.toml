[project]
name = "investmentsys"
version = "0.0.1"
description = "Sistema multi-agente de análisis y optimización de portafolios sobre Google ADK"
readme = "CLAUDE.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "google-adk==2.9.1",  # ADR-005: subir de versión es un cambio deliberado
    "pydantic>=2.12,<3",
    "pandas>=2.2.3",
    "numpy>=2.0",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "httpx>=0.28",  # cliente de Tiingo (ADR-011); ya era transitiva de google-genai
]

[dependency-groups]
deploy = [
    "google-cloud-aiplatform[adk,agent-engines]>=2.1.3",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
    "scipy-stubs>=1.14",
]
eval = [
    "google-adk[eval]==2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investmentsys"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # texto en español con acentos en docstrings/comentarios

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["investmentsys"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["google.adk.*", "scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "golden: test de regresión con valores del ejercicio de referencia",
]
