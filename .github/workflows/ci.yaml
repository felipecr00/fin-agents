name: ci
on:
  pull_request:
  workflow_call:   # en main lo invoca deploy.yaml: nada se despliega sin make check verde
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv python install   # versión fijada en .python-version
      - run: uv sync --locked    # falla si uv.lock no coincide con pyproject
      - run: make lint
      - run: make type
      - run: make test
