name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install   # versión fijada en .python-version
      - run: uv sync --locked    # falla si uv.lock no coincide con pyproject
      - run: make lint
      - run: make type
      - run: make test
