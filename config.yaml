# Parámetros del sistema. Ningún número mágico vive fuera de este archivo.
portafolio:
  activos: [VOOG, BNS, IBIT, VB]
  valor_usd: 9739.94
  pesos_actuales: {VOOG: 0.7944, BNS: 0.0892, IBIT: 0.0676, VB: 0.0488}

optimizacion:
  aversion_riesgo_delta: 2.5
  tau: 0.05
  tasa_libre_riesgo: 0.04
  peso_min: 0.02
  peso_max: 0.70
  permitir_cortos: false
  metodo_covarianza: historica   # historica | ledoit_wolf
  # he_litterman: Ω = diag(P·τΣ·Pᵀ), como en el ejercicio de referencia.
  # idzorek: Ω derivada de View.confianza. Se decide en S1; el golden test usa he_litterman.
  metodo_omega: he_litterman

prior_equilibrio:
  metodo: capitalizacion
  # Proxies de capitalización en US$ billones (10^12): large growth US, BNS, BTC, small caps US.
  # Valores del ejercicio de referencia (docs/referencia_black_litterman.py).
  capitalizacion_usd_billones: {VOOG: 28.0, BNS: 0.116, IBIT: 1.9, VB: 2.5}

estimacion:
  # Nivel del intervalo t de Student de los retornos históricos anualizados (QuantEstimates).
  nivel_confianza: 0.95
  # Ledoit-Wolf (ADR-003): objetivo de correlación constante; la intensidad se estima sobre
  # la ventana común de todos los activos y se aplica a la matriz histórica híbrida.

regimen:
  # Clasificador simple de régimen (quant/regimen.py). Etiqueta descriptiva: no cambia pesos.
  # Índice de referencia = promedio simple de estos activos (renta variable amplia; IBIT queda
  # fuera porque su volatilidad dominaría el índice y solo cotiza desde 2024).
  activos_referencia: [VOOG, VB]
  ventana_tendencia_meses: 6
  ventana_volatilidad_meses: 6
  observaciones_minimas: 24
  umbral_tendencia: 0.05          # ±5 % acumulado en la ventana separa alcista/bajista de lateral
  drawdown_estres: 0.15           # caída desde el máximo de la muestra…
  ratio_volatilidad_estres: 1.3   # …con volatilidad reciente ≥ 1,3× la de toda la muestra

datos:
  proveedor: csv
  ruta_csv: data/precios.csv
  ventana_covarianza_meses: 60

validacion:
  sharpe_oos_minimo: 0.20
  max_drawdown_tolerado: 0.35
  turnover_maximo_anual: 1.0
  # Herfindahl máximo de los pesos aplicados (Σw²). 0.55 ≈ 1.8 activos efectivos; el
  # portafolio de referencia (70/7/2/21) queda en 0.539.
  concentracion_hhi_maxima: 0.55
  # Costo por unidad de turnover (Σ|Δw|), cobrado en CADA rebalanceo.
  costo_transaccion_bps: 10
  rebalanceo: mensual
  max_iteraciones_constructor: 2
  # Stress tests históricos: se incluyen los retornos de los meses en [desde, hasta].
  # No hay escenario 2020 (covid): data/precios.csv comienza en 2021-09.
  escenarios_stress:
    - {nombre: tasas_2022, desde: 2022-01-31, hasta: 2022-12-31}
    - {nombre: cripto_2025_26, desde: 2025-08-31, hasta: 2026-06-30}

agentes:
  # ADR-005: id fijo, nunca un alias -latest. Las credenciales van por variables de entorno.
  modelo: gemini-3.5-flash
  temperatura: 0.2
  # Intentos del analista hasta que su salida valide contra MarketViews (incluye el primero).
  max_intentos_analista: 3
  horizonte_views_meses: 12
  # Tope de views por corrida y confianza máxima cuando la evidencia es ambigua o contradictoria.
  # Los lee la instrucción del analista y los verifican los evalsets (ADR-010).
  max_views: 4
  confianza_max_sin_conviccion: 0.5
  # ADR-008: en Vertex AI con proyecto (prod) el modelo se pide al endpoint global; la región
  # del despliegue (us-central1) no sirve los Gemini 3.x. Con API key no se usa.
  ubicacion_vertex: global
  # Un 429/503 de Gemini es transitorio (cuota por minuto, picos de demanda) y sin reintentos
  # tumba la corrida entera. Esperas: 2, 4, 8, 16, 32 s (≈ 1 min en total, más jitter): cubre la
  # ventana de cuota por minuto y cabe en el timeout de 300 s de Cloud Run.
  reintentos_modelo:
    intentos: 6
    espera_inicial_s: 2.0
    espera_maxima_s: 60.0
    base_exponencial: 2.0
    codigos_http: [408, 429, 500, 502, 503, 504]

evaluacion:
  # Criterios universales de los evalsets del analista (ADR-010). Una view absoluta es un
  # retorno TOTAL a 12 meses; una relativa, un diferencial. Por encima de estos topes la view
  # no es "sobria", diga lo que diga la noticia.
  q_absoluta_max: 0.30
  q_relativa_max: 0.20

sensibilidad:
  # Rejilla del análisis de sensibilidad (risk/sensibilidad.py): cada magnitud se aplica con
  # signo + y −, a un supuesto por vez. Son errores de estimación plausibles, no escenarios.
  retornos_pp: [0.01, 0.02]      # ± sobre el q de cada view y sobre μ posterior de cada activo
  covarianza_rel: [0.10, 0.20]   # ± relativo: volatilidad por activo, correlación por par y Σ
  parametros_rel: [0.10, 0.20]   # ± relativo sobre δ y τ

corridas:
  # RunState y reporte de cada corrida: <directorio>/<run_id>/ (relativo a la raíz del repo).
  directorio: runs

reproducibilidad:
  semilla: 42
  # ADR-009: diferencia absoluta máxima admitida al repetir en local una corrida remota
  # (macOS/arm64 vs. linux/x86-64 no garantizan igualdad bit a bit entre BLAS distintos).
  tolerancia_replay: 1.0e-8
