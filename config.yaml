# Parámetros del sistema. Ningún número mágico vive fuera de este archivo.
portafolio:
  # Semilla del universo inicial (ADR-012). El universo VIGENTE vive en datos.gestor.ruta_universo
  # y cambia con el Gestor de Datos (incorporar / refrescar_cap), no editando esta lista.
  activos: [VOOG, BNS, IBIT, VB]
  valor_usd: 9739.94
  pesos_actuales: {VOOG: 0.7944, BNS: 0.0892, IBIT: 0.0676, VB: 0.0488}

optimizacion:
  aversion_riesgo_delta: 2.5
  tau: 0.05
  tasa_libre_riesgo: 0.04
  peso_min: 0.02
  peso_max: 0.70
  permitir_cortos: false
  metodo_covarianza: historica   # historica | ledoit_wolf
  # he_litterman: Ω = diag(P·τΣ·Pᵀ), como en el ejercicio de referencia.
  # idzorek: Ω derivada de View.confianza. Se decide en S1; el golden test usa he_litterman.
  metodo_omega: he_litterman

prior_equilibrio:
  metodo: capitalizacion
  # Qué prior se usa cuando falta alguna cap Y el usuario aceptó degradar (ADR-013):
  # neutral = equal-weight sobre TODO el universo (política activa); solo_views = π = 0.
  degradacion: neutral
  # Proxies de capitalización en US$ billones (10^12): large growth US, BNS, BTC, small caps US.
  # Valores del ejercicio de referencia (docs/referencia_black_litterman.py). Son las caps
  # PINNEADAS del universo de referencia (procedencia `usuario`): las usa el golden test y con
  # ellas se sembró datos.gestor.ruta_universo. Cambiar una cap vigente es `refrescar_cap`.
  capitalizacion_usd_billones: {VOOG: 28.0, BNS: 0.116, IBIT: 1.9, VB: 2.5}
  as_of: 2026-09-16
  metodologia: "tamaño económico del subyacente, no AUM (large growth US, BNS, BTC, small caps US)"

estimacion:
  # Nivel del intervalo t de Student de los retornos históricos anualizados (QuantEstimates).
  nivel_confianza: 0.95
  # Ledoit-Wolf (ADR-003): objetivo de correlación constante; la intensidad se estima sobre
  # la ventana común de todos los activos y se aplica a la matriz histórica híbrida.

regimen:
  # Clasificador simple de régimen (quant/regimen.py). Etiqueta descriptiva: no cambia pesos.
  # Índice de referencia = promedio simple de estos activos (renta variable amplia; IBIT queda
  # fuera porque su volatilidad dominaría el índice y solo cotiza desde 2024).
  activos_referencia: [VOOG, VB]
  ventana_tendencia_meses: 6
  ventana_volatilidad_meses: 6
  observaciones_minimas: 24
  umbral_tendencia: 0.05          # ±5 % acumulado en la ventana separa alcista/bajista de lateral
  drawdown_estres: 0.15           # caída desde el máximo de la muestra…
  ratio_volatilidad_estres: 1.3   # …con volatilidad reciente ≥ 1,3× la de toda la muestra

datos:
  # El pipeline SIEMPRE lee las series locales (reproducible y sin red). Tiingo solo lo usan
  # `make update-prices` y el Gestor de Datos, que validan y escriben esas series (ADR-011, S7).
  proveedor: series
  directorio_series: data/series   # un CSV por activo: <TICKER>.csv
  ventana_covarianza_meses: 60
  gestor:
    # Universo vigente (diagnósticos + caps congeladas) e historial de cambios de input.
    ruta_universo: data/universo.json
    ruta_historial: data/universo_historial.jsonl
    # Tiingo no informa la moneda: se deduce de la bolsa. Fuera de esta lista = no soportada.
    bolsas_usd: [NYSE, NASDAQ, NYSE ARCA, NYSE MKT, AMEX, BATS]
    # Menos meses que esto = no apto (ni covarianza ni backtest dicen nada con tan poco).
    meses_minimos_apto: 12
    # marketCap de la fuente viene en US$; las caps se guardan en US$ billones (10^12).
    usd_por_unidad_cap: 1.0e12
  tiingo:
    # La API key va en la variable de entorno TIINGO_API_KEY; nunca aquí.
    url_base: https://api.tiingo.com
    fecha_inicio: 2021-09-01       # primer mes del histórico (extenderlo = cambiar esta fecha)
    timeout_s: 30.0
    # Solo se reintentan 429 y timeouts. Free tier: 50 req/hora; usamos ~4 por actualización.
    reintentos: {intentos: 4, espera_inicial_s: 2.0, espera_maxima_s: 60.0, base_exponencial: 2.0}
  actualizacion:
    # Continuidad: |retorno mensual nuevo − vigente| máximo en la ventana solapada (0.005 = 0,5 p.p.).
    # Por encima, la actualización ABORTA: ajuste retroactivo o error de fuente; decide un humano.
    tolerancia_continuidad: 0.005
    # Sanidad: |retorno mensual simple| máximo creíble (IBIT es volátil).
    retorno_mensual_max: 0.60
    # Únicos activos que pueden empezar después de tiingo.fecha_inicio.
    activos_inicio_tardio: [IBIT]
    backups_a_conservar: 3
    decimales_csv: 4
    directorio_resumenes: runs/actualizaciones

validacion:
  sharpe_oos_minimo: 0.20
  max_drawdown_tolerado: 0.35
  turnover_maximo_anual: 1.0
  # Herfindahl máximo de los pesos aplicados (Σw²). 0.55 ≈ 1.8 activos efectivos; el
  # portafolio de referencia (70/7/2/21) queda en 0.539.
  concentracion_hhi_maxima: 0.55
  # Costo por unidad de turnover (Σ|Δw|), cobrado en CADA rebalanceo.
  costo_transaccion_bps: 10
  rebalanceo: mensual
  max_iteraciones_constructor: 2
  # Stress tests históricos: se incluyen los retornos de los meses en [desde, hasta].
  # No hay escenario 2020 (covid): data/precios.csv comienza en 2021-09.
  escenarios_stress:
    - {nombre: tasas_2022, desde: 2022-01-31, hasta: 2022-12-31}
    - {nombre: cripto_2025_26, desde: 2025-08-31, hasta: 2026-06-30}

# Abstracción de inferencia (enmienda v2 §4, ADR-018). ESTE es el único archivo del repo donde
# aparece el nombre comercial de un modelo: docs y código hablan de niveles. Rotar un modelo es
# cambiar estas líneas; `tests/unit/test_nombres_de_modelos.py` vigila que siga siendo así.
inferencia:
  # Nivel 1 — Frontier LLM: razonamiento, síntesis y redacción. Id fijo, nunca un alias -latest
  # (ADR-005). `cliente` es la clase de ADK que lo sirve ("módulo:Clase"). Las credenciales van
  # por variables de entorno; `secreto_llave` es el nombre del secreto de dev en Secret Manager.
  nivel_1:
    cliente: google.adk.models.google_llm:Gemini
    modelo: gemini-3.5-flash
    secreto_llave: gemini-api-key
  # Nivel 2 — Edge/cuantizado (NLP local): sin asignar; nada lo usa todavía (S12+).
  nivel_2: null
  # Nivel 3 — determinista: código puro (quant/, portfolio/, risk/, data_manager/). Nunca un LLM.
  nivel_3: determinista
  # Qué nivel atiende a cada agente con LLM.
  asignaciones:
    director: nivel_1
    market_analyst: nivel_1
    constructor: nivel_1
    reporter: nivel_1
    estadistico: nivel_1
    esceptico: nivel_1
  # Marcas que no pueden aparecer fuera de este archivo (lo verifica un test y `make nombres`).
  nombres_vetados: [gemini, claude, gpt, whisper, finbert, sonnet]
  # Nombres que impone el tooling y no son menciones de un modelo: el archivo de instrucciones
  # del asistente de código (lo referencian Dockerfile y pyproject) y su carpeta de ajustes.
  excepciones_de_tooling: [CLAUDE.md, .claude]

agentes:
  temperatura: 0.2
  # Estadístico y Escéptico (S10, ADR-019): personas thin que redactan sobre las cifras de su tool.
  temperatura_personas: 0.1
  # Intentos del analista hasta que su salida valide contra MarketViews (incluye el primero).
  max_intentos_analista: 3
  horizonte_views_meses: 12
  # Tope de views por corrida y confianza máxima cuando la evidencia es ambigua o contradictoria.
  # Los lee la instrucción del analista y los verifican los evalsets (ADR-010).
  max_views: 4
  confianza_max_sin_conviccion: 0.5
  # ADR-008: en Vertex AI con proyecto (prod) el modelo se pide al endpoint global; la región
  # del despliegue (us-central1) no sirve el modelo de Nivel 1. Con API key no se usa.
  ubicacion_vertex: global
  # Un 429/503 del modelo es transitorio (cuota por minuto, picos de demanda) y sin reintentos
  # tumba la corrida entera. Esperas: 2, 4, 8, 16, 32 s (≈ 1 min en total, más jitter): cubre la
  # ventana de cuota por minuto y cabe en el timeout de 300 s de Cloud Run.
  reintentos_modelo:
    intentos: 6
    espera_inicial_s: 2.0
    espera_maxima_s: 60.0
    base_exponencial: 2.0
    codigos_http: [408, 429, 500, 502, 503, 504]

evaluacion:
  # Criterios universales de los evalsets del analista (ADR-010). Una view absoluta es un
  # retorno TOTAL a 12 meses; una relativa, un diferencial. Por encima de estos topes la view
  # no es "sobria", diga lo que diga la noticia.
  q_absoluta_max: 0.30
  q_relativa_max: 0.20

fintual:
  # Gobernanza operativa en Fintual Acciones (fintual/, ADR-020). No-Trade Zone: banda ABSOLUTA
  # alrededor del peso objetivo (0.05 = ±5 p.p.: objetivo 55 % → [50 %, 60 %]). Dentro de banda
  # la orden es HOLD obligatorio. `bandas_por_activo` sobrescribe la banda de un activo.
  banda_inercia: 0.05
  bandas_por_activo: {}
  decimales_usd: 2               # Fintual compra fracciones: montos exactos al centavo
  dias_historia_dividendos: 400  # historia de ex-dividendos que se consulta a la fuente
  tributario:
    # Filtro tributario CONSULTIVO (fintual/tax_filter.py, ADR-022). Son SUPUESTOS TUYOS, no
    # hechos ni asesoría: cada salida los declara. Edítalos con tu situación real.
    tasa_marginal: 0.135   # tu tramo marginal supuesto sobre la ganancia realizada
    usd_clp: 950.0         # tipo de cambio supuesto para expresar el costo en CLP (manual)
    # Costo de adquisición TOTAL por activo, en US$. Sin declarar, el costo fiscal se reporta
    # como COTA (se asume que toda la venta es ganancia) y no se detectan pérdidas latentes.
    costo_base_usd: {}

sensibilidad:
  # Rejilla del análisis de sensibilidad (risk/sensibilidad.py): cada magnitud se aplica con
  # signo + y −, a un supuesto por vez. Son errores de estimación plausibles, no escenarios.
  retornos_pp: [0.01, 0.02]      # ± sobre el q de cada view y sobre μ posterior de cada activo
  covarianza_rel: [0.10, 0.20]   # ± relativo: volatilidad por activo, correlación por par y Σ
  parametros_rel: [0.10, 0.20]   # ± relativo sobre δ y τ

corridas:
  # RunState y reporte de cada corrida: <directorio>/<run_id>/ (relativo a la raíz del repo).
  directorio: runs
  # ADR-021: los hitos del comité se muestran en el chat MIENTRAS corre (cola de eventos de la
  # invocación de ADK, API privada con cercos). false = solo bitácora + cronología al cierre.
  transmitir_hitos_en_vivo: true

reproducibilidad:
  semilla: 42
  # ADR-009: diferencia absoluta máxima admitida al repetir en local una corrida remota
  # (macOS/arm64 vs. linux/x86-64 no garantizan igualdad bit a bit entre BLAS distintos).
  tolerancia_replay: 1.0e-8
